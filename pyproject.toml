[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radius-rag-server"
version = "0.1.0"
description = "RAG search server with FastAPI, MCP and bundle management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "httpx2==2.13.1",
    "numpy>=2,<3",
    "faiss-cpu>=1.10,<2",
    "mcp==2.2.0",
    "prometheus-client>=0.21,<1",
    "websockets>=14,<16",
    "Pillow>=10,<12",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
py-modules = ["rag_server", "retrieval_evaluator"]

[project.scripts]
radius-rag-evaluator = "radius_rag.observability.evaluation.entrypoint:main"
retrieval-admin = "radius_rag.observability.retrieval_admin_cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "faiss.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=tests/e2e/test_mcp_long_tool_worker.py"
markers = [
    "acceptance: requires a live ComfyUI backend",
    "integration: requires RETRIEVAL_DATABASE_URL (TimescaleDB/PostgreSQL)",
]
