[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radius-rag-server"
version = "0.1.0"
description = "RAG search server with FastAPI, MCP and bundle management"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "faiss-cpu>=1.10,<2",
    "mcp==2.2.0",
    "prometheus-client>=0.21,<1",
    "websockets>=14,<16",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.setuptools]
packages = []
py-modules = [
    "comfy_client",
    "comfy_workflow",
    "image_analysis",
    "image_generation",
    "image_generation_config",
    "image_generation_errors",
    "image_mcp_backends",
    "image_mcp_capabilities",
    "image_mcp_ops",
    "image_reference",
    "comfy_segment_workflow",
    "comfy_segmentation",
    "image_concurrency",
    "image_segmentation",
    "image_segmentation_config",
    "image_segmentation_types",
    "image_timings",
    "image_mcp_schemas",
    "image_mcp_tools",
    "image_safety",
    "image_upscale",
    "image_upscale_config",
    "llm_client",
    "llm_params",
    "rag_bundle",
    "rag_metrics",
    "rag_proxy",
    "rag_search",
    "rag_server",
    "rag_service",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "faiss.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--ignore=test_mcp_long_tool_worker.py"
